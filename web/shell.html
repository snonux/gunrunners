<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Gunrunners</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #ddd; font: 16px sans-serif; overflow: hidden; }
  #canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; outline: none; }
  #status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<div id="status">Loading Gunrunners&hellip;</div>
<script>
  var statusEl = document.getElementById('status');
  var Module = {
    canvas: document.getElementById('canvas'),
    setStatus: function (text) { statusEl.textContent = text; statusEl.style.display = text ? 'flex' : 'none'; },
    onRuntimeInitialized: function () { Module.setStatus(''); Module.canvas.focus(); },
    print: function (t) { console.log(t); },
    printErr: function (t) { console.warn(t); }
  };
  window.addEventListener('click', function () { Module.canvas.focus(); });
</script>
{{{ SCRIPT }}}
</body>
</html>
