<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Play Gunrunners in your browser</title>
<meta name="description" content="Play Gunrunners, a free neon jump-n-shoot, right in your browser. Also for Linux and Android.">
<meta name="theme-color" content="#140a26">
<link rel="icon" href="../site/icon.png">
<!-- Added to a phone's home screen, the page opens full screen in landscape
     (the only way on iPhones, whose Safari has no full screen for pages). -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="../site/icon.png">
<!-- The game files next to this page (gunrunners.js, .wasm, .data) are built
     from the latest release by the Pages workflow (web/pages.yml); the
     workflow also fills in the version below. -->
<style>
  @font-face { font-family: "Exo 2"; font-style: italic; font-weight: 700 900; font-display: swap; src: url(../site/fonts/exo2-italic.woff2) format("woff2"); }
  @font-face { font-family: "Inter"; font-style: normal; font-weight: 400 600; font-display: swap; src: url(../site/fonts/inter.woff2) format("woff2"); }
  :root { --bg: #140a26; --panel: #241443; --line: #3a2563; --text: #ece6ff; --muted: #b5a8d8; --hot: #ff3fae; --cyan: #2fd8ff; --sun: #ffb02e; --gold: #ffd84a; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--text); font: 16px/1.5 "Inter", system-ui, sans-serif; overflow: hidden; }
  a { color: var(--cyan); }
  #canvas { position: absolute; display: block; outline: none; background: #000; }
  #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 16px; text-align: center;
    background: radial-gradient(ellipse at 50% 70%, #3a1660 0%, var(--bg) 70%); }
  #loader[hidden] { display: none; }
  /* The website's logo (docs/site/style.css): sunset gradient, cyan
     offset shadow, and a VHS glitch every few seconds. */
  .logo { margin: 0; font: italic 900 clamp(40px, 10vw, 96px)/1 "Exo 2", "DejaVu Sans", sans-serif; letter-spacing: -0.01em;
    background: linear-gradient(180deg, #fff6b0 0%, var(--sun) 40%, #ff5d6c 70%, var(--hot) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(4px 4px 0 #0aa9d6) drop-shadow(0 0 22px rgba(255, 63, 174, 0.35));
    /* The site glitches every 6 s; the loading screen is often gone by
       then, so here it breaks up within the first second and every 2.4 s. */
    animation: glitch 2.4s -1.6s infinite; }
  @keyframes glitch {
    0%, 90%, 100% { transform: none; filter: drop-shadow(4px 4px 0 #0aa9d6) drop-shadow(0 0 22px rgba(255, 63, 174, 0.35)); }
    91% { transform: translate(-4px, 1px) skewX(-10deg); filter: drop-shadow(-5px 0 0 var(--cyan)) drop-shadow(5px 0 0 var(--hot)); }
    93% { transform: translate(5px, -2px) skewX(8deg); filter: drop-shadow(6px 0 0 var(--cyan)) drop-shadow(-6px 0 0 var(--hot)); }
    95% { transform: translate(-2px, 0) skewX(-3deg); filter: drop-shadow(-3px 2px 0 var(--sun)) drop-shadow(3px -2px 0 var(--cyan)); }
    97% { transform: none; filter: drop-shadow(4px 4px 0 #0aa9d6) drop-shadow(0 0 30px rgba(255, 63, 174, 0.7)); }
  }
  /* The website's faint CRT scanlines, over the loading screen only (not
     over the game). */
  #loader::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(180deg, rgba(0, 0, 0, 0.13) 0 1px, transparent 1px 3px); mix-blend-mode: multiply; }
  @media (prefers-reduced-motion: reduce) { .logo { animation: none; } }
  .bar { width: min(560px, 86vw); height: 22px; border: 2px solid var(--line); border-radius: 12px; background: var(--panel); overflow: hidden; }
  .fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--hot), #ff6a5a 55%, var(--sun)); transition: width 0.15s linear; }
  .pct { font: italic 900 42px "Exo 2", "DejaVu Sans", sans-serif; color: var(--text); margin: 0; }
  .what { margin: 0; color: var(--muted); min-height: 1.5em; }
  .note { margin: 18px 0 0; max-width: 560px; color: var(--muted); font-size: 14px; }
  .error { color: var(--hot); }
  /* Full screen toggle: in the side bars a phone's wide screen leaves next
     to the 16:9 game, else small over its top edge. */
  #fullscreen { position: fixed; z-index: 10; width: 44px; height: 44px; padding: 0; border: 1.5px solid var(--cyan); border-radius: 12px;
    background: rgba(20, 10, 38, 0.6); color: var(--text); cursor: pointer; touch-action: manipulation; }
  #fullscreen[hidden] { display: none; }
  #fullscreen svg { width: 24px; height: 24px; display: block; margin: auto; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }
  .back { position: fixed; top: 10px; left: 12px; font-size: 14px; color: var(--muted); text-decoration: none; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<button type="button" id="fullscreen" title="Full screen" aria-label="Full screen" hidden>
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
</button>
<div id="loader">
  <a class="back" href="../">&larr; gunrunners.snonux.foo</a>
  <h1 class="logo">GUNRUNNERS</h1>
  <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill"></div></div>
  <p class="pct">0%</p>
  <p class="what">Loading the game&hellip;</p>
  <p class="note">The browser version is the same game as the downloads, version @VERSION@.
    Rather install it? The <a href="../#get-android">Android</a> and <a href="../#get-linux">Linux</a>
    versions run smoother, work offline and support cloud saves.</p>
</div>
<script>
  (function () {
    var loader = document.getElementById('loader');
    var canvas = document.getElementById('canvas');
    var bar = loader.querySelector('.bar');
    var fill = loader.querySelector('.fill');
    var pct = loader.querySelector('.pct');
    var what = loader.querySelector('.what');
    var MB = 1024 * 1024;

    function progress(fraction, text) {
      var p = Math.max(0, Math.min(100, Math.floor(fraction * 100)));
      fill.style.width = p + '%';
      bar.setAttribute('aria-valuenow', p);
      pct.textContent = p + '%';
      if (text) what.textContent = text;
    }
    function fail(text) {
      what.textContent = text;
      what.className = 'what error';
    }

    // The largest 16:9 box that fits the window, so clicks and taps land
    // where the game draws (the game letterboxes 1280x720 inside it).
    var fsButton = document.getElementById('fullscreen');
    function fit() {
      var w = window.innerWidth, h = window.innerHeight;
      var cw = Math.min(w, h * 16 / 9), ch = cw * 9 / 16;
      canvas.style.width = cw + 'px';
      canvas.style.height = ch + 'px';
      canvas.style.left = (w - cw) / 2 + 'px';
      canvas.style.top = (h - ch) / 2 + 'px';
      // In the right-hand bar when there is room for it, else top centre.
      var bar = (w - cw) / 2;
      fsButton.style.left = (bar >= 56 ? w - bar / 2 - 22 : w / 2 - 22) + 'px';
      fsButton.style.top = (bar >= 56 ? 12 : 6) + 'px';
    }
    window.addEventListener('resize', fit);
    fit();

    // Full screen: the button toggles it; on a phone or tablet the first
    // touch also enters it (browsers allow that only from a tap) and turns
    // the screen to landscape where the browser lets a page do that.
    var root = document.documentElement;
    var canFull = !!(root.requestFullscreen || root.webkitRequestFullscreen);
    var touchDevice = navigator.maxTouchPoints > 0 && matchMedia('(pointer: coarse)').matches;
    function isFull() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
    function enterFull() {
      var req = root.requestFullscreen || root.webkitRequestFullscreen;
      var done = req.call(root, { navigationUI: 'hide' });
      Promise.resolve(done).then(function () {
        if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function () {});
      }).catch(function () {});
    }
    function exitFull() { (document.exitFullscreen || document.webkitExitFullscreen).call(document); }
    // The game's FULLSCREEN menu item comes here (src/main.cpp).
    window.__fullscreen = { set: function (on) { if (!canFull || on === isFull()) return; if (on) enterFull(); else exitFull(); }, get: isFull };
    function syncButton() {
      fsButton.hidden = !canFull || (touchDevice && isFull());
      fsButton.title = fsButton.ariaLabel = isFull() ? 'Leave full screen' : 'Full screen';
      setTimeout(fit, 100);
    }
    if (canFull) {
      fsButton.addEventListener('click', function (e) {
        e.stopPropagation();
        if (isFull()) exitFull(); else enterFull();
        canvas.focus();
      });
      document.addEventListener('fullscreenchange', syncButton);
      document.addEventListener('webkitfullscreenchange', syncButton);
      if (touchDevice) {
        window.addEventListener('touchend', function first() {
          if (!isFull()) enterFull();
        }, { once: true, capture: true });
      }
    }
    syncButton();

    window.Module = {
      canvas: canvas,
      // Emscripten reports the game data download as "... (loaded/total)".
      setStatus: function (text) {
        var m = /\((\d+(?:\.\d+)?)\/(\d+)\)/.exec(text || '');
        if (m) {
          var done = +m[1], total = +m[2];
          progress(done / total, 'Downloading the game: ' + (done / MB).toFixed(1) + ' of ' + (total / MB).toFixed(1) + ' MB');
        }
      },
      monitorRunDependencies: function (left) {
        if (left === 0) progress(1, 'Starting the game…');
      },
      onFirstFrame: function () {
        loader.hidden = true;
        fit();
        canvas.focus();
      },
      onAbort: function () {
        loader.hidden = false;
        fail('The game stopped with an error. Reload the page to try again.');
      },
      setFullscreen: function (on) { window.__fullscreen.set(!!on); },
      isFullscreen: function () { return window.__fullscreen.get() ? 1 : 0; },
      print: function (t) { console.log(t); },
      printErr: function (t) { console.warn(t); }
    };
    window.addEventListener('click', function () { canvas.focus(); });

    var script = document.createElement('script');
    script.src = 'gunrunners.js';
    script.async = true;
    script.onerror = function () { fail('The browser version could not be loaded right now. Try again later, or install it for Android or Linux.'); };
    document.body.appendChild(script);
  })();
</script>
</body>
</html>
