# Release workflow for Gunrunners on Android, published through
# snonux/fdroid; see android/README.md, "Releasing".
#
# A pushed vX.Y.Z tag builds the release APK (arm64-v8a, armeabi-v7a and
# x86_64 in one file) with the app's release key and attaches it to the
# GitHub release of that tag as gunrunners-vX.Y.Z.apk. snonux/fdroid serves
# it from there.
#
# Secrets: ANDROID_KEYSTORE (base64 of the keystore), ANDROID_KEY_ALIAS,
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD; FDROID_DISPATCH_TOKEN is
# optional.
name: Release

on:
  push:
    tags: ['v*']
  # Rebuild the APK of a tag that already exists, e.g. after fixing a secret.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, e.g. v1.2.3
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  NDK_VERSION: 27.3.13750724
  FDROID_DISPATCH_TOKEN: ${{ secrets.FDROID_DISPATCH_TOKEN }}

jobs:
  apk:
    name: Signed APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: The tag matches the version in CMakeLists.txt
        run: |
          version=$(sed -n 's/^project(Gunrunners VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match version $version in CMakeLists.txt"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: NDK, CMake, meson
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" "ndk;$NDK_VERSION" "cmake;3.31.6" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          pip install --user meson
          sudo apt-get install -y ninja-build

      - name: Restore the release key
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE" ] || [ -z "$ANDROID_KEY_ALIAS" ] || \
             [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::The ANDROID_* signing secrets are not all set"
            exit 1
          fi
          keystore="$RUNNER_TEMP/release.jks"
          echo "$ANDROID_KEYSTORE" | base64 -d > "$keystore"
          chmod 600 "$keystore"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$keystore" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" \
            > android/key.properties
          chmod 600 android/key.properties

      - name: Build the APK
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          android/build.sh release

      - name: Signed with the release key, not the debug key
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          apk=android/app/build/outputs/apk/release/app-release.apk
          certs=$("$apksigner" verify --print-certs "$apk")
          echo "$certs"
          if echo "$certs" | grep -q 'CN=Android Debug'; then
            echo "::error::$apk is signed with the debug key"
            exit 1
          fi

      # A release written by hand before the tag was pushed keeps its notes.
      - name: Attach the APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "gunrunners-$TAG.apk"
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber "gunrunners-$TAG.apk"

      - name: Refresh the F-Droid repo now
        if: env.FDROID_DISPATCH_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.FDROID_DISPATCH_TOKEN }}
        run: gh api repos/snonux/fdroid/dispatches -f event_type=app-release

      - name: Forget the release key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" android/key.properties
