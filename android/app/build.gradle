// Gunrunners for Android (proof of concept). The native code is the normal
// game, built by the top-level CMakeLists.txt as libmain.so; SDL2's own Java
// glue (org.libsdl.app) comes straight from the SDL2 source tree that
// android/build-deps.sh fetches, so nothing of SDL is copied in here.

plugins {
    id 'com.android.application'
}

def sdlJava = "${rootDir}/deps/SDL2/android-project/app/src/main/java"
def gameData = "${rootDir}/.."
def generatedAssets = layout.buildDirectory.dir('generated/gunrunners-assets')

// One version for every platform: project(Gunrunners VERSION x.y.z) in the
// top-level CMakeLists.txt. versionCode = x * 10000 + y * 100 + z.
def gameVersion = (file("${gameData}/CMakeLists.txt").text =~ /project\(Gunrunners VERSION (\d+)\.(\d+)\.(\d+)/)[0]
def gameVersionName = "${gameVersion[1]}.${gameVersion[2]}.${gameVersion[3]}"
def gameVersionCode = gameVersion[1].toInteger() * 10000 + gameVersion[2].toInteger() * 100 + gameVersion[3].toInteger()

// Release signing: android/key.properties (storeFile, storePassword,
// keyAlias, keyPassword), written by the release workflow from secrets or
// kept on the developer's machine; never committed. Without it the release
// build is signed with the debug key.
def keyProperties = new Properties()
def keyPropertiesFile = rootProject.file('key.properties')
if (keyPropertiesFile.exists()) {
    keyPropertiesFile.withInputStream { keyProperties.load(it) }
}

android {
    namespace 'org.buetow.gunrunners'
    compileSdk 35
    ndkVersion '27.3.13750724'

    defaultConfig {
        applicationId 'org.buetow.gunrunners'
        minSdk 24
        targetSdk 35
        versionCode gameVersionCode
        versionName gameVersionName
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    signingConfigs {
        if (keyProperties['storeFile']) {
            release {
                storeFile rootProject.file(keyProperties['storeFile'])
                storePassword keyProperties['storePassword']
                keyAlias keyProperties['keyAlias']
                keyPassword keyProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keyProperties['storeFile'] ? signingConfigs.release : signingConfigs.debug
        }
    }

    // F-Droid and reproducible builds: no Google dependency metadata blob.
    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }

    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
            version '3.31.6'
        }
    }

    sourceSets {
        main {
            java.srcDirs += [sdlJava]
            assets.srcDirs += [generatedAssets]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// levels/, cutscenes/ and fonts/ go into the APK as assets, with a manifest
// listing them: Android can't list APK assets from native code, and the game
// copies them to internal storage on start (src/frontend/android_data.cpp).
def syncGameData = tasks.register('syncGameData') {
    def out = generatedAssets.get().asFile
    inputs.dir("${gameData}/levels")
    inputs.dir("${gameData}/cutscenes")
    inputs.dir("${gameData}/fonts")
    outputs.dir(out)
    doLast {
        project.delete(out)
        def files = []
        ['levels', 'cutscenes', 'fonts'].each { dir ->
            project.copy {
                from "${gameData}/${dir}"
                into new File(out, "data/${dir}")
                include '*.txt', '*.ttf'
            }
            new File(out, "data/${dir}").eachFile { f -> files << "${dir}/${f.name}" }
        }
        new File(out, 'data/manifest.txt').text = files.sort().join('\n') + '\n'
    }
}
tasks.named('preBuild') { dependsOn syncGameData }
